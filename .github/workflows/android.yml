name: Android build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Release signing: use the repo's keystore secrets if present,
      # otherwise generate a throwaway keystore so the release APK is still signed.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PW="$SECRET_STORE_PASSWORD"; ALIAS="$SECRET_KEY_ALIAS"; KEY_PW="$SECRET_KEY_PASSWORD"
            echo "Using keystore from repository secrets"
          else
            STORE_PW="$(openssl rand -hex 16)"; KEY_PW="$STORE_PW"; ALIAS="circuitjs"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PW" -keypass "$KEY_PW" -dname "CN=CircuitJS CI"
            echo "::warning::No KEYSTORE_BASE64 secret set - signed with a temporary key. Updates will not install over earlier builds."
          fi
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$STORE_PW"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CircuitJS-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/CircuitJS-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CircuitJS-apks
          path: dist/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
